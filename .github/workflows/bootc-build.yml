name: build-bootc
on:
  pull_request:
  merge_group:
  schedule:
    - cron: "0 3 * * *" # 3 am everyday
  workflow_dispatch:
env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push-workstation:
    name: Build and push workstation image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image_name: [workstation]
        major_version: [44]
        include:
          - major_version: 44
            is_stable_version: true
            is_latest_version: true
    steps:
      - name: Checkout Push to Registry action
        uses: actions/checkout@v5.0.0
      - name: Matrix Variables
        run: |
          echo "MAJOR_VERSION=${{ matrix.major_version }}" >> $GITHUB_ENV
          echo "BASE_IMAGE=quay.io/fedora/fedora-bootc" >> $GITHUB_ENV
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> $GITHUB_ENV

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          # Generate a timestamp for creating an image version history
          TIMESTAMP="$(date +%Y%m%d)"
          VARIANT="${{ matrix.major_version }}"

          COMMIT_TAGS=()
          BUILD_TAGS=()

          BUILD_TAGS=("${VARIANT}")

          # Append matching timestamp tags to keep a version history
          for TAG in "${BUILD_TAGS[@]}"; do
              BUILD_TAGS+=("${TAG}-${TIMESTAMP}")
          done

          if [[ "${{ matrix.is_stable_version }}" == "true" ]]; then
              BUILD_TAGS+=("stable")
          fi
          if [[ "${{ matrix.is_latest_version }}" == "true" ]]; then
              BUILD_TAGS+=("latest")
          fi
              alias_tags=("${BUILD_TAGS[@]}")

          echo "Generated the following build tags: "
          for TAG in "${BUILD_TAGS[@]}"; do
              echo "${TAG}"
          done

          echo "alias_tags=${alias_tags[*]}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR (for pulling private images)
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Image
        run: |
          set -ouex pipefail
          sudo -E podman build \
            --build-arg IMAGE_NAME=${{ matrix.image_name }} \
            --build-arg MAJOR_VERSION=${{ env.MAJOR_VERSION }} \
            --build-arg BASE_IMAGE=${{ env.BASE_IMAGE }} \
            --secret id=mok_priv_b64,env=MOK_PRIV_B64 \
            -t localhost/${{ env.IMAGE_NAME }}:unchunked \
            -f ./Containerfile.bootc \
            .
        env:
          MOK_PRIV_B64: ${{ secrets.MOK_PRIV_B64 }}

      # Split the image into content-based layers, so an update only downloads
      # the packages that changed. Uses the chunkah that ships in fedora-bootc.
      - name: Rechunk with chunkah
        id: rechunk
        run: |
          set -ouex pipefail
          TAGS=(${{ steps.generate-tags.outputs.alias_tags }})
          UNCHUNKED="localhost/${{ env.IMAGE_NAME }}:unchunked"
          OUT="$(sudo mktemp -d /var/tmp/chunkah.XXXXXX)"
          sudo podman inspect "${UNCHUNKED}" > /tmp/chunkah-config.json

          # files that aren't from an RPM get their mtime clamped to the commit
          # time, so unchanged content produces identical layers from day to day
          sudo podman run --rm \
            --security-opt label=disable \
            --mount=type=image,src="${UNCHUNKED}",target=/chunkah \
            -v /tmp/chunkah-config.json:/run/chunkah-config.json:ro \
            -v "${OUT}:/run/out" \
            --entrypoint chunkah \
            "${UNCHUNKED}" \
            build \
              --rootfs /chunkah \
              --max-layers 128 \
              --prune /sysroot/ \
              --label ostree.commit- --label ostree.final-diffid- \
              --config /run/chunkah-config.json \
              --source-date-epoch "$(git log -1 --format=%ct)" \
              --output oci:/run/out/chunked

          # drop the unchunked image before importing, so the runner never holds
          # more than two copies
          sudo podman rmi "${UNCHUNKED}"
          CHUNKED="$(sudo podman pull -q "oci:${OUT}/chunked")"
          sudo rm -rf "${OUT}"
          sudo podman inspect "${CHUNKED}" --format '{{len .RootFS.Layers}} layers, {{.Size}} bytes'

          for TAG in "${TAGS[@]}"; do
            sudo podman tag "${CHUNKED}" "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          done

          echo "image=${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS[*]}" >> $GITHUB_OUTPUT

      - name: Configure sigstore attachments
        run: |
          sudo mkdir -p /etc/containers/registries.d
          sudo cp files/etc/containers/registries.d/toby-st.yaml /etc/containers/registries.d/toby-st.yaml

      - name: Push To GHCR
        id: push
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -ouex pipefail
          echo "${{ github.token }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "${KEY_2025_11_B64}" | base64 -d > /tmp/cosign.key

          TAGS=(${{ steps.rechunk.outputs.tags }})
          for TAG in "${TAGS[@]}"; do
            sudo podman push \
              --sign-by-sigstore-private-key=/tmp/cosign.key \
              "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          done

          rm -f /tmp/cosign.key

          DIGEST=$(sudo podman inspect --format='{{index .RepoDigests 0}}' \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${TAGS[0]}" \
            | cut -d@ -f2)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
        env:
          KEY_2025_11_B64: ${{ secrets.KEY_2025_11_B64 }}

      - name: Echo outputs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"
